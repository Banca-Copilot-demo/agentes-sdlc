name: Comprobar Port

# La logica vive en el estandar: la pregunta «¿llegan las credenciales de Port a este repositorio?»
# es identica en todos los repositorios de dominio, y copiarla garantizaba que divergiera (Y1).
# Aqui solo se declara cuando corre y que secretos se le pasan.
on:
  workflow_dispatch:

jobs:
  check-port-access:
    uses: Banca-Copilot-demo/estandar-agentico/.github/workflows/check-port-access.yml@main
    # SE NOMBRAN UNO A UNO Y NO `secrets: inherit`: heredar en bloque le entregaria tambien las
    # credenciales de la App del ciclo de vida y el token de Copilot, que este workflow no necesita.
    secrets:
      port-client-id: ${{ secrets.PORT_CLIENT_ID }}
      port-client-secret: ${{ secrets.PORT_CLIENT_SECRET }}
