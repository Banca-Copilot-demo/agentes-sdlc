name: Publicar

# Se dispara al empujar una etiqueta, y no al mergear: el merge deja el contenido listo, la
# etiqueta es la que declara "esta version es la que se publica".
# DOS PATRONES DE ETIQUETA. Un repositorio de un solo plugin en la raiz usa `vX.Y.Z`; uno que
# aloja varios usa `<nombre>--vX.Y.Z`, porque `vX.Y.Z` no diria de cual. La accion de publicacion
# traduce el nombre a su subruta y empaqueta solo ese plugin.
on:
  push:
    tags:
      - "v*.*.*"
      - "*--v*.*.*"

# Los permisos se declaran en el LLAMADOR aunque el workflow reutilizable tambien los declare:
# medido en la demo, un llamador sin bloque `permissions` termina en `startup_failure` sin ningun
# mensaje que explique por que.
permissions:
  contents: write
  id-token: write
  attestations: write
  # LO NECESITA EL GUARDIAN DE LA PROMOCION, que pregunta si la comprobacion de comportamiento del
  # commit etiquetado quedo en verde. Es una LECTURA: la publicacion no escribe ninguna comprobacion.
  #
  # SE ABRE AQUI Y NO EN EL WORKFLOW REUTILIZABLE, y no es una preferencia: un workflow reutilizable
  # NO puede pedir mas permisos de los que le concede su llamador. Si lo pidiera el del estandar, una
  # organizacion que no pueda concederlo veria morir la publicacion entera en `startup_failure`
  # ANTES de sellar nada -- exactamente lo que paso con `copilot-requests` --. Sin esta linea la
  # publicacion se completa igual y el artefacto se queda en Conforme, con la razon escrita en el log.
  checks: read
  # LO NECESITA EL MISMO GUARDIAN, para saber QUE COMMIT SE EVALUO. La suite corre una sola vez, en
  # la solicitud de cambio, o sea sobre el sha de la RAMA; el merge con squash crea un commit NUEVO
  # en `main` -- otro sha, el mismo contenido -- y es ese el que se etiqueta. Preguntar por las
  # comprobaciones del commit etiquetado seria preguntar por un commit que nadie evaluo, y hasta
  # ahora colaba solo porque el push a `main` lo reevaluaba todo: la respuesta llegaba de una segunda
  # pasada que duplicaba el gasto de inferencia y que ya se retiro.
  #
  # `/commits/{sha}/pulls` devuelve la solicitud de cambio que introdujo el commit, y de ahi sale el
  # sha donde vive la medicion. Tambien es una LECTURA: la publicacion no escribe en ningun pull
  # request. Sin esta linea la consulta responde 403, se avisa, y el artefacto se queda en Conforme
  # con la razon escrita -- nunca en verde por no haber podido comprobar --.
  pull-requests: read

jobs:
  publicar:
    uses: Banca-Copilot-demo/estandar-agentico/.github/workflows/publicar.yml@main
    with:
      repositorio-indice: Banca-Copilot-demo/marketplace
    secrets:
      # Las tres son opcionales a proposito: sin ellas la publicacion se completa igual. La ficha y
      # el aviso al indice son ACELERADORES -- lo que da la garantia es el sello.
      port-client-id: ${{ secrets.PORT_CLIENT_ID }}
      port-client-secret: ${{ secrets.PORT_CLIENT_SECRET }}
      # La App NO escribe en el repositorio del indice: solo acuna un token efimero, acotado a ese
      # repositorio, para disparar alli un EVENTO que despierta su workflow. Los permisos que
      # escriben el catalogo son INTERNOS de ese repositorio. Son las mismas credenciales que ya usa
      # el etiquetado, asi que no hay ninguna credencial nueva que gestionar.
      app-id: ${{ secrets.APP_ID_AGENTICO }}
      app-key: ${{ secrets.APP_KEY_AGENTICO }}
      # AQUI YA NO SE PASA `copilot-token`, y quitarlo es obligatorio, no una limpieza: la suite se
      # ejecuta UNA SOLA VEZ, en el pull request, asi que publicar no habla con ningun modelo y el
      # workflow reutilizable dejo de declarar ese secreto. Un llamador que siga pasando un secreto
      # que el llamado no declara NO se ignora: falla con «is not defined in the referenced
      # workflow», y falla al arrancar, o sea sin publicar nada.
